<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>路慢慢 · 首页局部优化候选</title>
<style>
/* Preview only. Original assets remain unchanged. All record text is from the user's screenshot. */
:root {
  --paper: #f6f4ed; /* 暖纸张：沿用已确认背景 */
  --ink: #20261f; /* 深墨色：正文 */
  --muted: #626b60; /* 灰绿：辅助文字 */
  --green: #3f5f4c; /* 墨绿：操作入口 */
  --orange: #d97849; /* 陶土橙：选中状态 */
}
* { box-sizing: border-box; }
body { margin: 0; width:1080px; background:var(--paper); font-family:'Microsoft YaHei',sans-serif; color:var(--ink); }
.page { position:relative; width:360px; height:800px; zoom:3; overflow:hidden; background:var(--paper);
  background-image:linear-gradient(#59634605 1px,transparent 1px),linear-gradient(90deg,#59634605 1px,transparent 1px); background-size:8px 8px; }
.status { height:34px; padding:12px 22px 0; display:flex; align-items:center; justify-content:space-between; font-size:11px; font-weight:600; }
.status-right { display:flex; align-items:center; gap:5px; }
.signal { display:flex; align-items:end; gap:1px; height:10px; }
.signal i { width:2px; background:var(--ink); }
.signal i:nth-child(1) {height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:10px}
.battery { border:1px solid var(--muted); border-radius:3px; padding:0 3px; font-size:8px; }
header { position:absolute; left:22px; right:22px; top:54px; }
.brand { font-size:11px; letter-spacing:4px; color:var(--muted); margin-bottom:10px; }
.date { display:flex; gap:12px; align-items:baseline; }
h1 { margin:0; font-size:30px; line-height:1.2; font-weight:650; letter-spacing:-1px; }
.weekday { font-size:15px; color:var(--muted); }
.photo-area { position:absolute; left:22px; top:190px; width:316px; }
.photo-frame { position:relative; width:316px; height:336px; margin:0; background:#fdfbf5;
  border:1px solid #6f675a24; box-shadow:0 6px 17px #5b513310; padding:36px 27px 20px; }
.portrait { position:relative; width:260px; height:279px; overflow:hidden; background:#e6d5be; }
.portrait img { position:absolute; width:606.015px; max-width:none; height:auto; left:-173.008px; top:-516.09px; }
.pets { position:absolute; width:166px; height:auto; top:-83px; right:2px; z-index:2; filter:drop-shadow(0 1px 1px #3c301a12); pointer-events:none; }
.replace { display:flex; justify-content:flex-end; }
button { font:inherit; border:0; background:transparent; color:var(--green); cursor:pointer; min-height:44px; }
.replace button { font-size:12px; padding:0 2px 0 16px; }
button:focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
.quote { position:absolute; left:27px; right:27px; top:564px; margin:0; }
.quote-mark { color:var(--orange); font-size:23px; height:18px; line-height:1; }
.quote p { font-size:16px; line-height:1.6; margin:4px 0 0; font-weight:600; }
.mood { position:absolute; left:22px; right:22px; top:652px; padding-top:7px; border-top:1px solid #20261f24; }
.mood-head { display:flex; justify-content:space-between; align-items:center; height:36px; }
h2 { font-size:18px; font-weight:650; margin:0; }
.mood-head button { font-size:13px; padding:0; }
.moods { display:flex; justify-content:space-between; gap:20px; margin-top:3px; }
.moods p { margin:4px 0 0 12px; font-size:11px; color:var(--muted); }
.moods span { font-size:12px; font-weight:600; }
.moods span::before { content:''; display:inline-block; vertical-align:1px; width:6px; height:6px; margin-right:6px; border-radius:50%; background:var(--orange); }
.moods div:last-child span::before { background:#a3a89f; }
nav { position:absolute; bottom:0; width:100%; height:55px; display:flex; border-top:1px solid #20261f24; background:var(--paper); padding-bottom:8px; }
nav button { flex:1; position:relative; font-size:12px; color:var(--muted); }
nav button.active { color:var(--ink); }
nav button.active::after { content:''; position:absolute; bottom:2px; left:35px; width:20px; height:2px; background:var(--orange); border-radius:2px; }
.homebar { position:absolute; width:112px; height:3px; border-radius:3px; bottom:3px; left:124px; background:#77796f; }
</style>
</head>
<body>
<main class="page" aria-label="首页优化候选，尚未实施到 App">
  <div class="status"><span>10:12</span><span class="status-right"><span>5G</span><span class="signal"><i></i><i></i><i></i><i></i></span><span class="battery">26</span></span></div>
  <header><div class="brand">路慢慢</div><div class="date"><h1>9月8日</h1><span class="weekday">星期二</span></div></header>
  <section class="photo-area" aria-label="照片">
    <figure class="photo-frame"><div class="portrait"><img src="../references/today-phone-feedback-2026-09-08.jpg" alt="用户截图中可见的人像区域"></div></figure>
    <img class="pets" src="../approved/today-cat-dog-cutout.png" alt="原样缩小的白狗与狸花猫，靠在相纸上边框">
    <div class="replace"><button type="button">换一张</button></div>
  </section>
  <blockquote class="quote"><div class="quote-mark">“</div><p>每一个平凡的奋斗者，<br>都是卓越的追梦人。</p></blockquote>
  <section class="mood"><div class="mood-head"><h2>今天的心情</h2><button type="button">去记下</button></div><div class="moods"><div><span>开心 · 0条</span><p>今天还没有。</p></div><div><span>不开心 · 0条</span><p>今天还没有。</p></div></div></section>
  <nav aria-label="导航预览"><button class="active" type="button">今天</button><button type="button">收支</button><button type="button">回想</button><button type="button">记下</button></nav>
  <div class="homebar"></div>
</main>
</body>
</html>
